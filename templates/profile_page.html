<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .profile-container {
            max-width: 400px;
            margin: 50px auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
        }
        .profile-picture {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 15px;
            object-fit: cover;
        }
        .profile-name {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .profile-bio {
            font-size: 16px;
            color: #555;
            margin: 10px 0 20px;
        }
        .profile-details {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .profile-details li {
            font-size: 14px;
            color: #666;
            padding: 5px 0;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <img src="https://via.placeholder.com/120" alt="Profile Picture" class="profile-picture">
        <h1 class="profile-name">John Doe</h1>
        <p class="profile-bio">Web Developer | Tech Enthusiast | Blogger</p>
        <ul class="profile-details">
            <li>Email: johndoe@example.com</li>
            <li>Phone: +123 456 7890</li>
            <li>Location: San Francisco, CA</li>
        </ul>
    </div>
</body>
</html>
